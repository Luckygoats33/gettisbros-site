<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --black: #111111;
  --dark: #1A1A1A;
  --gold: #E8A924;
  --gold-hover: #F0BC40;
  --white: #FFFFFF;
  --font: "Segoe UI", Roboto, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
}
body {
  font-family: var(--font);
  background: var(--black);
  color: var(--white);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 24px;
}
.logo {
  margin-bottom: 40px;
}
.logo img {
  height: 80px;
  width: auto;
}
.error-code {
  font-size: clamp(80px, 15vw, 140px);
  font-weight: 800;
  color: var(--gold);
  line-height: 1;
  margin-bottom: 8px;
  letter-spacing: -2px;
}
h1 {
  font-size: clamp(18px, 4vw, 28px);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 3px;
  margin-bottom: 16px;
  color: var(--white);
}
p {
  font-size: 16px;
  color: #999;
  max-width: 460px;
  line-height: 1.7;
  margin-bottom: 36px;
}
.btns {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  justify-content: center;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 14px 30px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.3s ease;
  text-decoration: none;
}
.btn-gold {
  background: var(--gold);
  color: var(--black);
}
.btn-gold:hover {
  background: var(--gold-hover);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(232, 169, 36, 0.3);
}
.btn-outline {
  background: transparent;
  color: var(--white);
  border: 2px solid rgba(255,255,255,0.2);
}
.btn-outline:hover {
  border-color: var(--white);
  background: rgba(255,255,255,0.05);
}
.divider {
  width: 60px;
  height: 3px;
  background: var(--gold);
  margin: 0 auto 24px;
  border-radius: 2px;
}
.phone {
  margin-top: 48px;
  font-size: 14px;
  color: #666;
  letter-spacing: 0.5px;
}
.phone a {
  color: var(--gold);
  text-decoration: none;
  font-weight: 700;
}
.phone a:hover {
  color: var(--gold-hover);
}
.footer-line {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 14px;
  text-align: center;
  font-size: 12px;
  color: #444;
  background: rgba(0,0,0,0.5);
}
