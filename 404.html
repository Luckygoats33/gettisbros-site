<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon.png">
<title>Page Not Found | Gettis Bros Asphalt & Construction</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --black: #111111;
  --gold: #E8A924;
  --white: #FFFFFF;
  --font: "Segoe UI", Roboto, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
}
body {
  font-family: var(--font);
  background: var(--black);
  color: var(--white);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 24px;
}
.error-code {
  font-size: clamp(80px, 15vw, 160px);
  font-weight: 800;
  color: #7D5A07;
  line-height: 1;
  margin-bottom: 16px;
}
h1 {
  font-size: clamp(20px, 4vw, 32px);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 16px;
}
p {
  font-size: 17px;
  color: #666;
  max-width: 480px;
  line-height: 1.7;
  margin-bottom: 32px;
}
.btns {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  justify-content: center;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 15px 32px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.3s ease;
  text-decoration: none;
}
.btn-gold {
  background: var(--gold);
  color: var(--black);
}
.btn-gold:hover {
  background: #F0BC40;
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(232, 169, 36, 0.35);
}
.btn-outline {
  background: transparent;
  color: var(--white);
  border: 2px solid rgba(255,255,255,0.3);
}
.btn-outline:hover {
  border-color: var(--white);
  background: rgba(255,255,255,0.05);
}
.phone {
  margin-top: 40px;
  font-size: 15px;
  color: #666;
}
.phone a {
  color: #7D5A07;
  text-decoration: none;
  font-weight: 700;
}
</style>
</head>
<body>
<div class="error-code">404</div>
<h1>Page Not Found</h1>
<p>The page you're looking for doesn't exist or has been moved. Let us help you find what you need.</p>
<div class="btns">
  <a href="/" class="btn btn-gold">Back to Home</a>
  <a href="/contact.html" class="btn btn-outline">Contact Us</a>
</div>
<div class="phone">Need help? Call <a href="tel:9713507325">(971) 350-7325</a></div>
</body>
</html>
